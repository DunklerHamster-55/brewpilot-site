<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrewPilot — Dein persönlicher Kaffee-Coach</title>
<style>
  :root { --copper:#8D6E63; --espresso:#2A1F1B; --cream:#F5EDE6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background:var(--cream); color:var(--espresso); min-height:100vh;
         display:flex; align-items:center; justify-content:center; text-align:center; }
  .wrap { padding:40px 24px; max-width:480px; }
  .logo { width:96px; height:96px; border-radius:24px; background:linear-gradient(160deg,var(--copper),#6D4C41);
          display:inline-flex; align-items:center; justify-content:center; font-size:48px; margin-bottom:24px; }
  h1 { font-size:32px; margin-bottom:8px; }
  .tagline { color:var(--copper); font-weight:500; font-size:18px; margin-bottom:20px; }
  p { color:#5D4E47; line-height:1.6; margin-bottom:28px; }
  .soon { display:inline-block; background:var(--espresso); color:var(--cream);
          border-radius:99px; padding:12px 28px; font-weight:600; margin-bottom:36px; }
  .links a { color:var(--copper); font-weight:500; margin:0 12px; text-decoration:none; }
  .links a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">☕</div>
  <h1>BrewPilot</h1>
  <p class="tagline">Dein persönlicher Kaffee-Coach</p>
  <p>Dial-In-Assistent, Bohnen-Import per Foto und Link, Frische- und Vorrats-Tracking, geführte Brühpläne — komplett privat, alle Daten bleiben auf deinem iPhone.</p>
  <div class="soon">Bald im App Store</div>
  <div class="links">
    <a href="/support/">Support</a> ·
    <a href="/privacy/">Datenschutz</a> ·
    <a href="mailto:info@brew-pilot.com">Kontakt</a>
  </div>
</div>
</body>
</html>
